
name: Build FUNKY BUILDER

on:
  workflow_dispatch:
  push:
    paths:
      - 'schematic-builder.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: unzip -o schematic-builder.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod
        working-directory: schematic-builder
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FUNKY-BUILDER-JAR
          path: schematic-builder/build/libs/*.jar
          
