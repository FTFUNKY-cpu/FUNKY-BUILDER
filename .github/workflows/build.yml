
name: Build FUNKY BUILDER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Find and build project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name settings.gradle -not -path '*/.gradle/*' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FUNKY-BUILDER-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          
