
name: Build FUNKY BUILDER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Extract source ZIP
        run: |
          mkdir -p extracted
          unzip -o FUNKY_BUILDER_source.zip -d extracted

      - name: Find and build
        shell: bash
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle settings file not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          gradle -p "$DIR" build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FUNKY-BUILDER-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
